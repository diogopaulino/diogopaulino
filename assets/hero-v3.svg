<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">Diogo Paulino</title>
  <desc id="desc">Tech Manager, Frontend and AI. Building products, teams and systems that scale.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".62" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientTransform="translate(785 52) rotate(142) scale(350 230)">
      <stop stop-color="#2f81f7" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#2f81f7" stop-opacity=".035"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".018"/>
    </pattern>
  </defs>

  <rect width="900" height="210" rx="20" fill="url(#bg)"/>
  <rect width="900" height="210" rx="20" fill="url(#glow)"/>
  <rect width="900" height="210" rx="20" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="899" height="209" rx="19.5"
    fill="none" stroke="#30363d" stroke-opacity=".78"/>

  <!-- subtle architecture motif -->
  <g opacity=".30" stroke="#58a6ff" fill="none" stroke-width="1.2">
    <path d="M700 66H758L792 100H840"/>
    <path d="M722 132H770L804 98"/>
    <path d="M758 66V118"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="700" cy="66" r="3" opacity=".50"/>
    <circle cx="758" cy="66" r="3.5" opacity=".70"/>
    <circle cx="792" cy="100" r="4" opacity=".85"/>
    <circle cx="840" cy="100" r="3" opacity=".50"/>
    <circle cx="722" cy="132" r="3" opacity=".42"/>
    <circle cx="770" cy="132" r="3.5" opacity=".62"/>
  </g>
  <g fill="#58a6ff" opacity=".11">
    <circle cx="792" cy="100" r="25"/>
    <circle cx="792" cy="100" r="42"/>
  </g>

  <text x="54" y="52"
    fill="#8b949e"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="12.5" font-weight="600" letter-spacing="2">TECH · PRODUCT · AI</text>

  <text x="54" y="107"
    fill="#f0f6fc"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="49" font-weight="700" letter-spacing="-1.6">Diogo Paulino</text>

  <text x="54" y="143"
    fill="#c9d1d9"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="18.5">Tech Manager · Frontend · AI</text>

  <text x="54" y="175"
    fill="#8b949e"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="15">Building products, teams &amp; systems that scale.</text>

  <rect x="54" y="190" width="72" height="2.5" rx="1.25" fill="#2f81f7"/>
  <rect x="132" y="190" width="24" height="2.5" rx="1.25" fill="#58a6ff" fill-opacity=".32"/>
</svg>