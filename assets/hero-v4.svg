<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">Diogo Paulino</title>
  <desc id="desc">Tech Manager, Frontend and AI. Building products, teams and systems that scale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".58" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(760 40) rotate(140) scale(320 220)">
      <stop stop-color="#2f81f7" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#2f81f7" stop-opacity=".03"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".018"/>
    </pattern>
  </defs>

  <rect width="900" height="210" rx="20" fill="url(#bg)"/>
  <rect width="900" height="210" rx="20" fill="url(#glow)"/>
  <rect width="900" height="210" rx="20" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="899" height="209" rx="19.5" fill="none" stroke="#30363d" stroke-opacity=".78"/>

  <text x="54" y="50" fill="#8b949e"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="12.5" font-weight="600" letter-spacing="2">HELLO, I'M</text>

  <text x="54" y="105" fill="#f0f6fc"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="50" font-weight="700" letter-spacing="-1.6">Diogo Paulino</text>

  <text x="54" y="141" fill="#c9d1d9"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="18.5">Tech Manager · Developer · AI</text>

  <text x="54" y="173" fill="#8b949e"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="15">Building products, teams &amp; systems that scale.</text>

  <rect x="54" y="188" width="76" height="2.5" rx="1.25" fill="#2f81f7"/>
  <rect x="136" y="188" width="24" height="2.5" rx="1.25" fill="#58a6ff" fill-opacity=".32"/>
</svg>
