<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" role="img" aria-labelledby="title desc">
  <title id="title">Diogo Paulino</title>
  <desc id="desc">Tech Manager, Frontend and AI</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1"
