<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Diogo Paulino</title>
  <desc id="desc">Tech Manager, Frontend and AI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(780 36) rotate(135) scale(300 190)">
      <stop stop-color="#2f81f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".032"/>
    </pattern>
  </defs>

  <rect width="900" height="240" rx="22" fill="url(#bg)"/>
  <rect width="900" height="240" rx="22" fill="url(#glow)"/>
  <rect width="900" height="240" rx="22" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="899" height="239" rx="21.5" fill="none" stroke="#30363d"/>

  <g transform="translate(785 28)">
    <rect width="70" height="70" rx="20" fill="#58a6ff" fill-opacity=".07" stroke="#58a6ff" stroke-opacity=".15"/>
    <text x="35" y="45" text-anchor="middle" fill="#58a6ff"
      font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
      font-size="25" font-weight="700" letter-spacing="-1">DP</text>
  </g>

  <text x="58" y="66" fill="#8b949e"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="14" font-weight="600" letter-spacing="2">HELLO, I'M</text>

  <text x="58" y="121" fill="#f0f6fc"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="48" font-weight="700" letter-spacing="-1">Diogo Paulino</text>

  <text x="58" y="157" fill="#c9d1d9"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="19">Tech Manager · Frontend · AI</text>

  <text x="58" y="192" fill="#8b949e"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="15.5">Building products, teams &amp; systems that scale.</text>

  <rect x="58" y="211" width="86" height="3" rx="1.5" fill="#2f81f7"/>
  <rect x="151" y="211" width="34" height="3" rx="1.5" fill="#58a6ff" fill-opacity=".4"/>
</svg>